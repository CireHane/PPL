name: odza-wms-sys

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: odza-postgres
    env_file:
      - ./Backend/.env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-odza_users}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - odza-network

  # Node.js API Gateway
  api-gateway:
    build: ./Backend
    container_name: odza-api-gateway
    env_file:
      - ./Backend/.env
    environment:
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-odza_users}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-this}
      SESSION_EXPIRY_HOURS: ${SESSION_EXPIRY_HOURS:-8}
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./Backend/src:/app/src
      - ./Backend/package.json:/app/package.json
    networks:
      - odza-network
    command: npm run dev

  # Next.js Frontend
  odza-frontend:
    build: ./Frontend/odza-warehouse
    container_name: odza-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "3001:3001"
    volumes:
      - ./Frontend/odza-warehouse/app:/app/app
      - ./Frontend/odza-warehouse/components:/app/components
      - ./Frontend/odza-warehouse/lib:/app/lib
      - ./Frontend/odza-warehouse/public:/app/public
      - ./Frontend/odza-warehouse/package.json:/app/package.json
    networks:
      - odza-network
    depends_on:
      - api-gateway

volumes:
  postgres_data:

networks:
  odza-network:
    driver: bridge
